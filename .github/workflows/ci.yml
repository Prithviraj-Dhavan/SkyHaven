name: SkyHaven CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: skyhaven
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: "mysql://root:password@127.0.0.1:3306/skyhaven"
      JWT_SECRET: "ci_test_super_secret_jwt_key_2026_skyhaven"
      AI_PROVIDER: "rule_engine"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=backend

      - name: Provision MySQL Test Schema
        run: npx prisma db push --schema=backend/prisma/schema.prisma

      - name: Run Backend Unit & Integration Tests
        run: npm run test --workspace=backend

      - name: Run Frontend Component & Unit Tests
        run: npm run test --workspace=frontend

      - name: Build Monolith & Client (Typecheck & Bundling)
        run: npm run build
