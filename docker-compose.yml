version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: skyhaven-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: skyhaven
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skyhaven-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: skyhaven-monolith
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/skyhaven
      REDIS_URL: redis://redis:6379
      JWT_SECRET: skyhaven_production_secret_key_change_me
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
